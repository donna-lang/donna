name: Bootstrap

on:
  workflow_dispatch:

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout compiler
        uses: actions/checkout@v6

      - name: Check sources token
        env:
          SOURCES_REPO_TOKEN: ${{ secrets.SOURCES_REPO_TOKEN }}
        run: |
          if [ -z "$SOURCES_REPO_TOKEN" ]; then
            echo "::error::Missing SOURCES_REPO_TOKEN. Add a fine-grained PAT with Contents: Read and write and Pull requests: Read and write access to donna-lang/sources."
            exit 1
          fi

      - name: Checkout bootstrap sources
        uses: actions/checkout@v6
        with:
          repository: donna-lang/sources
          path: sources
          token: ${{ secrets.SOURCES_REPO_TOKEN }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git make
          make install-qbe

      - name: Build Donna
        run: make build SOURCES_DIR=sources

      - name: Generate bootstrap sources
        run: ./scripts/generate-bootstrap.sh sources

      - name: Create bootstrap update pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.SOURCES_REPO_TOKEN }}
          path: sources
          commit-message: Update bootstrap sources
          branch: actions/update-bootstrap-sources
          base: main
          delete-branch: true
          title: Update bootstrap sources
          body: |
            Generated by the Donna bootstrap workflow.

            This updates target assembly, FFI sources, and checksums from the current compiler.
