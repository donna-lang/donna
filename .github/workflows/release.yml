name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout compiler
        uses: actions/checkout@v4

      - name: Checkout bootstrap sources
        uses: actions/checkout@v4
        with:
          repository: donna-lang/sources
          path: sources

      - name: Install Zig
        uses: mlugg/setup-zig@v2

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git make zip
          make install-qbe

      - name: Build Donna
        run: make build SOURCES_DIR=sources

      - name: Self-host and test compiler
        run: make ci SOURCES_DIR=sources

      - name: Build release artifacts
        run: ./scripts/release.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
